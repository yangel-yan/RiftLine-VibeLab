app:
  name: Riftline
  slogan: Run the Rift. Recover the lost archives.
  description: Riftline is a PICO XR science-fiction rail runner. Switch lanes, jump, slide, and phase through hazards while recovering lost archives across 18 contracts, three regions, and an endless mode. The project includes a bilingual Chinese and English interface, controller and hand input, and configurable comfort and accessibility options.
